<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>this is a love song</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #1a274b;
      color: #d66ca7;
    }
    header {
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #d66ca7;
    }
    main {
      flex: 1;
      display: flex;
      padding: 20px;
      box-sizing: border-box;
      gap: 20px;
    }
    .playlist {
      flex: 1;
      border: 1px solid #d66ca7;
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
    }
    .playlist h2 {
      margin-top: 0;
      font-size: 18px;
      color: #d66ca7;
    }
    .track {
      cursor: pointer;
      margin: 5px 0;
      padding: 5px;
      border-radius: 4px;
      transition: background 0.2s;
        display: flex;
  justify-content: space-between;
  align-items: center;
}
    }
    .track:hover {
      background: rgba(214,108,167,0.2);
    }
    .track.active {
      background: rgba(214,108,167,0.4);
      font-weight: bold;
    }
    footer {
      padding: 10px;
      border-top: 1px solid #d66ca7;
      background: #1a274b;
    }
    audio {
      width: 100%;
    }
    .album-cover {
  width: 100%;
  max-width: 250px;
  display: block;
  margin: 0 auto 15px auto;
  border-radius: 6px;
  border: 1px solid #d66ca7;
}
.lyrics-btn {
  font-size: 12px;
  padding: 2px 6px;
  border: 1px solid #d66ca7;
  background: transparent;
  color: #d66ca7;
  cursor: pointer;
  border-radius: 4px;
}

.lyrics-btn:hover {
  background: rgba(214,108,167,0.2);
}

/* fenêtre paroles */
#lyricsOverlay {
  position: fixed;
  inset: 0;
  background: rgba(26,39,75,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#lyricsBox {
  background: #1a274b;
  border: 1px solid #d66ca7;
  color: #d66ca7;
  padding: 20px;
  max-width: 600px;
  max-height: 70vh;
  overflow-y: auto;
  border-radius: 8px;
  white-space: pre-wrap;
}

#lyricsClose {
  display: block;
  margin-bottom: 10px;
  cursor: pointer;
  text-align: right;
  font-weight: bold;
}

  </style>
</head>

<body>

  
  <div id="lyricsOverlay">
  <div id="lyricsBox">
    <div id="lyricsClose">✕ fermer</div>
    <div id="lyricsContent"></div>
  </div>
</div>

<header>this is a love song</header>
<main>
  <div class="playlist" id="musique">
    <h2>Meddor</h2>

    <img 
      src="musique/pochette.jpg"
      alt="Meddor"
      class="album-cover"
      onclick="document.querySelector('#musique .track')?.click()"
    />

    <div class="tracks"></div>
  </div>

  <div class="playlist" id="musique2">
    <h2>Discographie</h2>
    <div class="tracks"></div>
  </div>
</main>


<footer>
  <audio id="audioPlayer" controls></audio>
</footer>

<script>
let currentTrackElement = null;
let currentPlaylist = null;

async function loadPlaylist(folder, containerId) {
  try {
    const response = await fetch(`${folder}/playlist.json`);
    const tracks = await response.json();

    const container = document.querySelector(`#${containerId} .tracks`);
    const player = document.getElementById("audioPlayer");

    tracks.forEach(track => {
      let title, file, lyrics;

      if (typeof track === "string") {
        title = track;
        file = track;
      } else {
        title = track.title;
        file = track.file;
        lyrics = track.lyrics;
      }

      const div = document.createElement("div");
      div.className = "track";

      const titleSpan = document.createElement("span");
      titleSpan.textContent = title;
      titleSpan.onclick = () => playTrack(folder, file, div, container);

      div.appendChild(titleSpan);

      // bouton paroles UNIQUEMENT pour la colonne gauche
      if (lyrics && containerId === "musique") {
        const btn = document.createElement("button");
        btn.className = "lyrics-btn";
        btn.textContent = "paroles";
        btn.onclick = (e) => {
          e.stopPropagation();
          showLyrics(lyrics);
        };
        div.appendChild(btn);
      }

      container.appendChild(div);
    });
  } catch (err) {
    console.error("Erreur playlist :", err);
  }
}
function playTrack(folder, file, trackElement, container) {
  const player = document.getElementById("audioPlayer");
  player.src = `${folder}/${file}`;
  player.play();

  if (currentTrackElement) {
    currentTrackElement.classList.remove("active");
  }
  trackElement.classList.add("active");
  currentTrackElement = trackElement;
  currentPlaylist = container; // ça met bien currentPlaylist à la colonne actuelle
}

document.getElementById("audioPlayer").addEventListener("ended", () => {
  if (!currentPlaylist || !currentTrackElement) return;

  const tracks = Array.from(currentPlaylist.querySelectorAll(".track"));

  const index = tracks.findIndex(t => t === currentTrackElement);
  if (index >= 0 && index < tracks.length - 1) {
    const nextTrack = tracks[index + 1];

    // déclenche la lecture automatique seulement si nextTrack existe
    nextTrack.querySelector("span").click();
  }
});


// paroles
function showLyrics(text) {
  document.getElementById("lyricsContent").textContent = text;
  document.getElementById("lyricsOverlay").style.display = "flex";
}

document.getElementById("lyricsClose").onclick = () => {
  document.getElementById("lyricsOverlay").style.display = "none";
};

loadPlaylist("musique", "musique");
loadPlaylist("musique2", "musique2");
</script>


</body>
</html>
